name: telegrive
description: "Your Telegram account as an unlimited drive."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.9
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.1
  handy_tdlib: ^2.3.10
  intl: ^0.20.3
  local_auth: ^3.0.2
  mime: ^2.1.0
  open_filex: ^4.7.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^2.6.5
  photo_manager: ^3.12.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  video_player: ^2.14.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  # Stands in for the phone's temp folder in tests that pick files.
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true

  assets:
    # Profile photo given to the drive channel in Telegram.
    - assets/brand/channel_photo.jpg

  # IBM Plex Sans (SIL Open Font License, assets/fonts/OFL.txt): the one
  # typeface, see DESIGN.md.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700

# Launcher icons, generated from tool/icon (see the comment there).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: tool/icon/out/icon.png
  adaptive_icon_background: tool/icon/out/background.png
  adaptive_icon_foreground: tool/icon/out/foreground.png
  adaptive_icon_monochrome: tool/icon/out/foreground.png
