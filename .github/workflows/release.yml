name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches pubspec.yaml
        id: version
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but pubspec.yaml has version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    needs: tag
    runs-on: ubuntu-latest
    # Long enough to build TDLib when the checks on main haven't cached it.
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/tdlib-android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - uses: ./.github/actions/telegram-api
        with:
          api-id: ${{ secrets.TELEGRAM_API_ID }}
          api-hash: ${{ secrets.TELEGRAM_API_HASH }}

      - name: Upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          for name in UPLOAD_KEYSTORE_BASE64 UPLOAD_KEYSTORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the $name repository secret."
              exit 1
            fi
          done
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          # A .properties file reads a backslash as an escape.
          escape() { printf '%s' "${1//\\/\\\\}"; }
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$(escape "$UPLOAD_KEYSTORE_PASSWORD")"
            echo "keyAlias=$(escape "$UPLOAD_KEY_ALIAS")"
            echo "keyPassword=$(escape "$UPLOAD_KEY_PASSWORD")"
          } > android/key.properties

      - name: Build
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define-from-file="$RUNNER_TEMP/telegram_api.json"
          flutter build appbundle --release \
            --dart-define-from-file="$RUNNER_TEMP/telegram_api.json"

      - name: Signed with the upload key
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          digest=$(keytool -exportcert -keystore "$RUNNER_TEMP/upload-keystore.jks" \
            -storepass "$UPLOAD_KEYSTORE_PASSWORD" -alias "$UPLOAD_KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          apksigner=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            certs=$("$apksigner" verify --print-certs "$apk")
            if ! grep -q "SHA-256 digest: $digest" <<<"$certs"; then
              echo "::error::$apk isn't signed with the upload key."
              exit 1
            fi
          done
          fingerprint=$(tr a-f A-F <<<"$digest" | sed 's/../&:/g; s/:$//')
          certs=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab)
          if ! grep -q "SHA256: $fingerprint" <<<"$certs"; then
            echo "::error::The app bundle isn't signed with the upload key."
            exit 1
          fi

      - name: Collect
        run: |
          mkdir dist
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=${apk##*/app-}
            cp "$apk" "dist/telegrive-$VERSION-${abi%-release.apk}.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab "dist/telegrive-$VERSION.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/
          if-no-files-found: error

  ios:
    needs: tag
    runs-on: macos-latest
    # Long enough to build TDLib when the checks on main haven't cached it.
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/tdlib-ios

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - uses: ./.github/actions/telegram-api
        with:
          api-id: ${{ secrets.TELEGRAM_API_ID }}
          api-hash: ${{ secrets.TELEGRAM_API_HASH }}

      # Unsigned: the helper apps people sideload with sign it with their own
      # Apple Account.
      - name: Build
        run: tool/build_ipa.sh --dart-define-from-file="$RUNNER_TEMP/telegram_api.json"

      - name: Collect
        run: |
          ipa="build/ios/ipa/telegrive-$VERSION.ipa"
          if ! unzip -l "$ipa" | grep -q 'Payload/Runner.app/Frameworks/tdjson.framework/tdjson$'; then
            echo "::error::$ipa doesn't carry TDLib."
            exit 1
          fi
          mkdir dist
          cp "$ipa" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/
          if-no-files-found: error

  publish:
    needs: [tag, android, ios]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Notes written for a version are in .github/release-notes; any other
      # release lists what changed since the last one.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$VERSION.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --generate-notes
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "Telegrive $VERSION" "$@"
