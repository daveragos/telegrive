name: Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  # A newer push to a pull request replaces its checks; on main they run
  # out, so TDLib's build below isn't cut short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # photo_manager hands out files only on Android and Apple platforms, so
    # the backup tests that read photos run on macOS and skip on Linux.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      # The analyzer and the tests need the credentials file to exist, not
      # to hold real credentials.
      - name: Credentials file
        run: cp lib/core/config/telegram_api.example.dart lib/core/config/telegram_api.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  tdlib:
    # Builds TDLib for Android when tool/build_tdlib_android.sh changes. A
    # run for a tag can restore only what its own tag or main cached, so the
    # cache the release workflow restores is kept here, on main.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/tdlib-android

  tdlib-ios:
    # The same for iOS, when tool/build_tdlib_ios.sh changes.
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/tdlib-ios
